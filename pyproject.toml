[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gyanbuddy-insights"
version = "0.1.0"
description = "Django marks analysis and audience-specific email reports"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.2,<5.3", "djangorestframework>=3.16,<3.17",
  "celery[redis]>=5.6,<5.7", "pandas>=2.0", "pydantic>=2.0,<3", "google-genai>=2.0,<3", "openai>=2.0,<4"
]

[tool.setuptools.packages.find]
include = ["gyanbuddy_insights*", "engine*"]

[tool.setuptools.package-data]
gyanbuddy_insights = ["templates/gyanbuddy_insights/*.html", "templates/gyanbuddy_insights/*.txt"]
